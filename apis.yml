name: Orion by Gravity
description: >-
  Orion by Gravity is a collaborative, AI-native analytics platform built by Gravity (bygravity.com)
  that connects directly to your data warehouse — Snowflake, BigQuery, Databricks, Redshift, Athena,
  Fabric, PostgreSQL, and MySQL — and lets teams ask questions in natural language to get shared
  analyses, dashboards, reports, scheduled workflows, and slide decks. Orion functions as an autonomous
  AI analyst that learns business context from a wiki-style Knowledge Base, integrates with Slack, Notion,
  Confluence, Looker, and Google Slides, and can be embedded as a white-label surface. Its primary
  programmatic surface is a remote Model Context Protocol (MCP) server at https://g.runorion.com/mcp that
  exposes twenty tools for AI assistants like Claude and Gemini Enterprise to run analyses, monitor KPIs,
  trigger workflows, and search the knowledge base. The platform is SOC 2 Type 2 audited.
